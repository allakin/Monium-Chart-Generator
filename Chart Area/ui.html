<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F7F8FA;
      color: #1A1A1A;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    h2 { font-size: 15px; font-weight: 600; }
    .subtitle { font-size: 11px; color: #808080; }
    .subtitle a { color: inherit; text-decoration: underline; }

    .target-bar {
      background: #EEEEF0;
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 16px;
      font-size: 11px;
      color: #808080;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .target-bar.active { background: #E8F0FE; color: #4D7CFE; }
    .target-bar .icon { flex-shrink: 0; width: 14px; height: 14px; }
    .target-bar .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .target-bar .size { margin-left: auto; flex-shrink: 0; opacity: 0.7; }

    .btn-regen {
      display: none;
      width: 100%;
      padding: 9px 0;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      background: #4D7CFE;
      color: #fff;
      margin-top: 10px;
    }
    .btn-regen:hover:not(:disabled) { background: #3A6AE8; }
    .btn-regen:active:not(:disabled) { transform: scale(0.97); }
    .btn-regen:disabled { opacity: 0.45; cursor: default; }

    .btn-copy {
      display: none;
      width: 100%;
      padding: 9px 0;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      background: #EEEEF0;
      color: #1A1A1A;
      margin-top: 6px;
    }
    .btn-copy:hover:not(:disabled) { background: #E0E0E0; }
    .btn-copy:active:not(:disabled) { transform: scale(0.97); }
    .btn-copy:disabled { opacity: 0.45; cursor: default; }

    .clipboard-box {
      display: none;
      background: #FFF6E0;
      border: 1px solid #F5D78A;
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 10px;
    }
    .clipboard-box .row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #7A5A0F;
    }
    .clipboard-box .summary {
      flex: 1;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .clipboard-box .clear-btn {
      border: none;
      background: transparent;
      color: #7A5A0F;
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
      line-height: 1;
    }
    .clipboard-box .clear-btn:hover { color: #1A1A1A; }

    /* Loading state: the box opens with a spinner and only then swaps in the
       summary, so the content change is visible and it is clear what was copied. */
    .clipboard-box .spinner {
      display: none;
      width: 11px;
      height: 11px;
      flex-shrink: 0;
      border: 1.5px solid #EBD6A6;
      border-top-color: #7A5A0F;
      border-radius: 50%;
      animation: clipboard-spin 0.6s linear infinite;
    }
    .clipboard-box.loading .spinner { display: block; }
    .clipboard-box.loading .summary { opacity: 0.7; }
    .clipboard-box.loading .clear-btn { visibility: hidden; }
    @keyframes clipboard-spin { to { transform: rotate(360deg); } }

    .btn-paste {
      width: 100%;
      margin-top: 8px;
      padding: 8px 0;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      background: #1A1A1A;
      color: #fff;
    }
    .btn-paste:hover:not(:disabled) { background: #333; }
    .btn-paste:active:not(:disabled) { transform: scale(0.97); }
    .btn-paste:disabled { opacity: 0.45; cursor: default; }

    .field { margin-top: 16px; }
    .field label { display: block; font-size: 11px; color: #808080; margin-bottom: 4px; }
    .field input,
    .field textarea {
      width: 100%;
      padding: 7px 10px;
      border: 1.5px solid #E0E0E0;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      color: #1A1A1A;
      outline: none;
      transition: border-color 0.15s;
    }
    .field textarea {
      resize: none;
      overflow: hidden;
      line-height: 1.4;
      display: block;
    }
    .field input:focus,
    .field textarea:focus { border-color: #4D7CFE; }
    .field input::placeholder,
    .field textarea::placeholder { color: #AAAAAA; }

    .radio-group {
      display: flex; gap: 6px;
    }
    .radio-option {
      flex: 1;
      padding: 7px 0;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      color: #808080;
      background: #EEEEF0;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .radio-option input { display: none; }
    .radio-option.active { background: #4D7CFE; color: #fff; }
    .radio-option:hover:not(.active) { background: #E0E0E0; }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      line-height: 1;
      color: #1A1A1A;
      cursor: pointer;
    }
    .checkbox-row input[type="checkbox"] {
      width: 14px;
      height: 14px;
      margin: 0;
      flex-shrink: 0;
      accent-color: #4D7CFE;
      cursor: pointer;
      vertical-align: middle;
    }

    /* Line color picker: one row per area, palette grid opens under the row. */
    .color-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px;
      border: 1.5px solid #E0E0E0;
      border-radius: 6px;
      background: #fff;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .color-row:hover { border-color: #C8C8CC; }
    .color-row.open { border-color: #4D7CFE; }
    .color-swatch {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 4px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1);
    }
    /* Auto without a known color yet: diagonal stripes instead of a fill. */
    .color-swatch.auto-empty {
      background: repeating-linear-gradient(45deg, #E0E0E0 0 3px, #F7F8FA 3px 6px);
    }
    .color-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #1A1A1A;
    }
    .color-value {
      flex-shrink: 0;
      font-size: 11px;
      color: #808080;
      font-variant-numeric: tabular-nums;
    }
    .color-reset {
      flex-shrink: 0;
      border: none;
      background: transparent;
      color: #808080;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
    }
    .color-reset:hover { color: #1A1A1A; }
    .palette-panel {
      padding: 8px;
      border: 1.5px solid #E0E0E0;
      border-radius: 6px;
      background: #fff;
    }
    .palette-auto {
      width: 100%;
      margin-bottom: 8px;
      padding: 5px 0;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      color: #808080;
      background: #EEEEF0;
      cursor: pointer;
    }
    .palette-auto:hover { background: #E0E0E0; }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 4px;
    }
    .palette-color {
      position: relative;
      aspect-ratio: 1;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      padding: 0;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1);
      transition: transform 0.1s;
    }
    .palette-color:hover { transform: scale(1.15); }
    .palette-color.selected { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px #1A1A1A; }
    /* Already pinned on another line — still selectable, just marked. */
    .palette-color.used::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 4px;
      margin: -2px 0 0 -2px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
    }
    .palette-empty { font-size: 11px; color: #808080; }
    .color-hint { margin-top: 6px; font-size: 11px; color: #808080; }
    .color-hint.error { color: #E53935; }
    .palette-custom {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      padding: 4px 6px;
      border-radius: 4px;
      background: #F7F8FA;
      box-shadow: inset 0 0 0 1.5px #1A1A1A;
      font-size: 11px;
      color: #1A1A1A;
    }

    .btn {
      width: 100%;
      margin-top: 16px;
      padding: 10px 0;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn-primary { background: #4D7CFE; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #3A6AE8; }
    .btn:disabled { opacity: 0.45; cursor: default; }

    .footer { text-align: center; font-size: 10px; color: #AAAAAA; margin-top: 4px; }

    .error-msg {
      display: none;
      font-size: 11px;
      color: #E53935;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div>
    <h2>Chart Area Generator</h2>
    <p class="subtitle">Monium Design System · <a href="https://github.com/allakin/Monium-Chart-Generator/wiki" target="_blank" rel="noopener">Documentation</a></p>
  </div>

  <div class="target-bar" id="targetBar">
    <svg class="icon" viewBox="0 0 14 14" fill="none">
      <rect x="1" y="1" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
    </svg>
    <span class="name" id="targetName">Select a Frame or AutoLayout</span>
    <span class="size" id="targetSize"></span>
  </div>

  <button class="btn-regen" id="regenBtn" onclick="regenerate()">Get values from chart</button>
  <button class="btn-copy" id="copyBtn" onclick="copyChart()">Copy chart</button>
  <div class="error-msg" id="regenError"></div>

  <div class="clipboard-box" id="clipboardBox">
    <div class="row">
      <span class="spinner"></span>
      <span class="summary" id="clipboardSummary">Chart copied</span>
      <button class="clear-btn" onclick="clearCopy()" title="Clear clipboard">×</button>
    </div>
    <button class="btn-paste" id="pasteBtn" onclick="pasteChart()">Paste exact copy</button>
  </div>

  <div class="field">
    <label>Y axis — values (comma-separated)</label>
    <textarea id="yInput" rows="1">0, 50, 100, 150, 200</textarea>
  </div>

  <div class="field">
    <label>Y axis — unit</label>
    <input type="text" id="yUnitInput" placeholder="ms, %, $, etc." value="">
  </div>

  <div class="field">
    <label>X axis — labels (comma-separated)</label>
    <textarea id="xInput" rows="1">Jan, Feb, Mar, Apr, May, Jun</textarea>
  </div>

  <div class="field">
    <label>X axis — unit</label>
    <input type="text" id="xUnitInput" placeholder="h, d, k, etc." value="">
  </div>

  <div class="field">
    <label>Areas count (1–20)</label>
    <input type="number" id="areasInput" value="3" min="1" max="20">
  </div>

  <div class="field">
    <label>Area colors</label>
    <div class="checkbox-group">
      <label class="checkbox-row">
        <input type="checkbox" id="customColorsCheck"> Custom area colors
      </label>
    </div>
  </div>

  <div class="field" id="seriesColorsField" style="display: none;">
    <label>Click an area to pick its color from the palette</label>
    <div class="color-list" id="seriesColorsList"></div>
    <div class="color-hint" id="seriesColorsHint"></div>
  </div>

  <div class="field">
    <label>Legend</label>
    <div class="checkbox-group">
      <label class="checkbox-row"><input type="checkbox" id="showLegendCheck"> Show legend</label>
    </div>
  </div>
  <div class="field" id="legendLabelsField" style="display: none;">
    <label>Legend labels (comma-separated; missing entries auto-named "Series N")</label>
    <textarea id="legendInput" rows="1" placeholder="e.g. AutocompleteKeys, GenerateYQL, SearchLogs"></textarea>
  </div>
  <div class="field" id="legendAlignField" style="display: none;">
    <label>Legend align</label>
    <div class="radio-group" id="legendAlignGroup">
      <label class="radio-option active" data-value="left"><input type="radio" name="legendAlign" value="left" checked> Left</label>
      <label class="radio-option" data-value="center"><input type="radio" name="legendAlign" value="center"> Center</label>
      <label class="radio-option" data-value="right"><input type="radio" name="legendAlign" value="right"> Right</label>
    </div>
  </div>

  <div class="field">
    <label>Area style</label>
    <div class="radio-group" id="styleGroup">
      <label class="radio-option active" data-value="smooth">
        <input type="radio" name="areaStyle" value="smooth" checked> Smooth
      </label>
      <label class="radio-option" data-value="sharp">
        <input type="radio" name="areaStyle" value="sharp"> Sharp
      </label>
      <label class="radio-option" data-value="peak">
        <input type="radio" name="areaStyle" value="peak"> Peak
      </label>
    </div>
  </div>

  <div class="field">
    <label>Area mode</label>
    <div class="radio-group" id="modeGroup">
      <label class="radio-option active" data-value="overlap" data-group="mode">
        <input type="radio" name="areaMode" value="overlap" checked> Overlap
      </label>
      <label class="radio-option" data-value="stacked" data-group="mode">
        <input type="radio" name="areaMode" value="stacked"> Stacked
      </label>
    </div>
  </div>

  <div class="field" id="fillHeightField" style="display: none;">
    <div class="checkbox-group">
      <label class="checkbox-row">
        <input type="checkbox" id="fillHeightCheck"> Fill full height
      </label>
    </div>
  </div>

  <div class="field">
    <label>Fill opacity (0.05–1.0)</label>
    <input type="number" id="opacityInput" value="0.3" min="0.05" max="1" step="0.05">
  </div>

  <div class="field">
    <label>Events</label>
    <div class="checkbox-group">
      <label class="checkbox-row">
        <input type="checkbox" id="topEventCheck"> Top Event
      </label>
      <label class="checkbox-row">
        <input type="checkbox" id="bottomEventCheck"> Bottom Event
      </label>
    </div>
  </div>

  <button class="btn btn-primary" id="insertBtn" onclick="generate()">Insert chart</button>

  <div class="footer">Monium Design System v2.5.1</div>

  <script>
    var DEFAULTS = {
      y: '0, 50, 100, 150, 200',
      x: 'Jan, Feb, Mar, Apr, May, Jun',
      areas: '3',
      style: 'smooth',
      mode: 'overlap',
      opacity: '0.3',
      fillHeight: false
    };

    var storedChartData = null;
    var replaceMode = false;
    var copiedChart = null;
    var pendingPasteData = null;
    var copyLoaderTimer = null;
    var COPY_LOADER_MS = 450;

    function setInsertEnabled(enabled) {
      document.getElementById('insertBtn').disabled = !enabled;
    }

    function setRegenEnabled(enabled) {
      document.getElementById('regenBtn').disabled = !enabled;
    }

    function showRegenError(text) {
      var el = document.getElementById('regenError');
      el.textContent = text;
      el.style.display = 'block';
    }

    function hideRegenError() {
      document.getElementById('regenError').style.display = 'none';
    }

    function copyChart() {
      hideRegenError();
      if (!storedChartData) return;
      if (!storedChartData.allSeries || !storedChartData.colors) {
        showRegenError('Exact copy unavailable: this chart was generated by an older version. Regenerate it once to enable Copy.');
        return;
      }
      copiedChart = JSON.parse(JSON.stringify(storedChartData));
      // Show the clipboard box in a loading state first: copying is instant, but
      // without the pause the box swaps its contents unnoticed and it is unclear
      // which chart data is now on the clipboard.
      showClipboardLoading();
      resizeUI();
      if (copyLoaderTimer) clearTimeout(copyLoaderTimer);
      copyLoaderTimer = setTimeout(function () {
        copyLoaderTimer = null;
        updateClipboardUI();
        resizeUI();
        var n = copiedChart.areasCount || 0;
        parent.postMessage({ pluginMessage: { type: 'notify', message: 'Chart copied — ' + n + ' area' + (n === 1 ? '' : 's') + ' ready to paste' } }, '*');
      }, COPY_LOADER_MS);
    }

    function showClipboardLoading() {
      var box = document.getElementById('clipboardBox');
      box.classList.add('loading');
      box.style.display = 'block';
      document.getElementById('clipboardSummary').textContent = 'Reading chart data…';
      document.getElementById('copyBtn').disabled = true;
      document.getElementById('pasteBtn').disabled = true;
    }

    function pasteChart() {
      if (!copiedChart) return;
      parent.postMessage({ pluginMessage: {
        type: 'paste',
        chartData: copiedChart
      }}, '*');
      // After the plugin renders the chart it will sendSelection back.
      // The next selection update should auto-populate the form (same UX as
      // clicking "Get values from chart") so the user can immediately edit.
      pendingPasteData = copiedChart;
    }

    function clearCopy() {
      if (copyLoaderTimer) { clearTimeout(copyLoaderTimer); copyLoaderTimer = null; }
      copiedChart = null;
      updateClipboardUI();
      resizeUI();
    }

    function updateClipboardUI() {
      // While the copy loader runs the box must stay in its loading state —
      // a selection update arriving meanwhile would otherwise cut it short.
      if (copyLoaderTimer) return;
      var box = document.getElementById('clipboardBox');
      box.classList.remove('loading');
      document.getElementById('copyBtn').disabled = false;
      document.getElementById('pasteBtn').disabled = false;
      if (copiedChart) {
        var n = copiedChart.areasCount || (copiedChart.allSeries ? copiedChart.allSeries.length : 0);
        var style = copiedChart.areaStyle || 'smooth';
        var styleLabel = style.charAt(0).toUpperCase() + style.slice(1);
        document.getElementById('clipboardSummary').textContent =
          'Copied: ' + n + ' area' + (n === 1 ? '' : 's') + ' · ' + styleLabel;
        box.style.display = 'block';
      } else {
        box.style.display = 'none';
      }
    }

    // Scoped per-group radio toggle: avoids cross-group deactivation when the
    // page has multiple radio-groups (style + mode + legendAlign).
    function bindRadioGroup(groupId) {
      document.querySelectorAll('#' + groupId + ' .radio-option').forEach(function (opt) {
        opt.addEventListener('click', function () {
          document.querySelectorAll('#' + groupId + ' .radio-option').forEach(function (o) {
            o.classList.remove('active');
          });
          opt.classList.add('active');
          opt.querySelector('input').checked = true;
          if (groupId === 'modeGroup') updateStackScaleVisibility();
        });
      });
    }
    bindRadioGroup('styleGroup');
    bindRadioGroup('modeGroup');
    bindRadioGroup('legendAlignGroup');

    function setRadioGroup(groupId, val) {
      document.querySelectorAll('#' + groupId + ' .radio-option').forEach(function (o) {
        o.classList.remove('active');
        if (o.dataset.value === val) {
          o.classList.add('active');
          o.querySelector('input').checked = true;
        }
      });
    }
    // Back-compat name used elsewhere in this file.
    function setRadio(groupId, val) { setRadioGroup(groupId, val); }

    function updateStackScaleVisibility() {
      var isStacked = getAreaMode() === 'stacked';
      document.getElementById('fillHeightField').style.display = isStacked ? 'block' : 'none';
    }

    function getAreaStyle() {
      var checked = document.querySelector('input[name="areaStyle"]:checked');
      return checked ? checked.value : 'smooth';
    }

    function getAreaMode() {
      var checked = document.querySelector('input[name="areaMode"]:checked');
      return checked ? checked.value : 'overlap';
    }

    function getLegendAlign() {
      var checked = document.querySelector('input[name="legendAlign"]:checked');
      return checked ? checked.value : 'left';
    }
    function setLegendAlign(val) { setRadioGroup('legendAlignGroup', val); }

    function autoResize(el) {
      if (!el || el.offsetParent === null) return; // hidden — scrollHeight is unreliable
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }
    function autoResizeLegendInput() { autoResize(document.getElementById('legendInput')); }

    ['yInput', 'xInput', 'legendInput'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', function () { autoResize(el); });
        autoResize(el);
      }
    });

    function updateLegendFieldsVisibility() {
      var on = document.getElementById('showLegendCheck').checked;
      document.getElementById('legendLabelsField').style.display = on ? 'block' : 'none';
      document.getElementById('legendAlignField').style.display = on ? 'block' : 'none';
      if (on) autoResizeLegendInput();
    }

    document.getElementById('showLegendCheck').addEventListener('change', function () {
      updateLegendFieldsVisibility();
      // When enabling the legend, pre-fill labels with "Series N" defaults for any
      // missing positions based on the current series count. Existing labels are
      // preserved (sync only appends/truncates).
      syncLegendLabelsToCount();
      renderSeriesColors();
      resizeUI();
    });

    // Sync legend labels with Areas count: when user increases count,
    // append default "Series N" entries; when user decreases, truncate the tail.
    // Existing user-typed labels are preserved at their positions.
    function syncLegendLabelsToCount() {
      if (!document.getElementById('showLegendCheck').checked) return;
      var newCount = Math.max(1, Math.min(20, parseInt(document.getElementById('areasInput').value) || 1));
      var legendEl = document.getElementById('legendInput');
      var labels = legendEl.value.split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
      if (newCount > labels.length) {
        for (var i = labels.length; i < newCount; i++) labels.push('Series ' + (i + 1));
      } else if (newCount < labels.length) {
        labels = labels.slice(0, newCount);
      }
      legendEl.value = labels.join(', ');
      autoResize(legendEl);
    }

    // 'change' (not 'input'): fires after value is committed (blur, Enter, or
    // spinner click), so typing "15" digit-by-digit doesn't truncate labels
    // at the intermediate "1" state.
    document.getElementById('areasInput').addEventListener('change', function () {
      syncLegendLabelsToCount();
      var before = colorState.length;
      syncColorsToCount();
      // New areas added while the picker is on get a concrete color right away.
      if (document.getElementById('customColorsCheck').checked && colorState.length > before) {
        var added = [];
        for (var i = before; i < colorState.length; i++) added.push(i);
        fillUnpinnedColors(added);
      }
      renderSeriesColors();
    });

    // ═══════════════════════════════════════════════
    //  Area color picker
    // ═══════════════════════════════════════════════
    // The palette comes from code.js (the same list the chart is generated
    // from), requested once on load. colorState[i] is the pinned hex of
    // line i or null for Auto; autoColorPreview[i] is the color the line
    // currently has on the chart, shown for Auto rows.
    var paletteHex = [];
    var paletteDisplay = []; // paletteHex sorted by hue for the grid
    var colorState = [];
    var autoColorPreview = [];
    var openColorRow = -1;
    var suggestRequestId = 0;
    var pendingSuggestSlots = [];
    var pendingSuggestLive = false;

    function getAreasCount() {
      return Math.max(1, Math.min(20, parseInt(document.getElementById('areasInput').value) || 1));
    }

    function rgbToHex(c) {
      if (!c) return null;
      var hex = '#';
      [c.r, c.g, c.b].forEach(function (v) {
        var n = Math.max(0, Math.min(255, Math.round(v * 255)));
        hex += (n < 16 ? '0' : '') + n.toString(16).toUpperCase();
      });
      return hex;
    }

    function normalizeHex(hex) {
      return (typeof hex === 'string' && /^#[0-9a-f]{6}$/i.test(hex.trim())) ? hex.trim().toUpperCase() : null;
    }

    function syncColorsToCount() {
      var n = getAreasCount();
      if (colorState.length > n) colorState = colorState.slice(0, n);
      while (colorState.length < n) colorState.push(null);
      if (openColorRow >= n) openColorRow = -1;
    }

    // A user's pick for one line. When a chart is selected the color is applied
    // to it at once (stroke + legend marker), without regenerating the chart.
    function setSeriesColor(index, hex) {
      syncColorsToCount();
      if (index < 0 || index >= colorState.length) return;
      colorState[index] = normalizeHex(hex);
      renderSeriesColors();
      recolorSelectedChart(index);
    }

    // Series the selected chart actually draws; rows past it (the form asks for
    // more than the chart has) only apply on "Insert chart".
    function selectedChartSeries() {
      if (!storedChartData) return 0;
      if (storedChartData.colors && storedChartData.colors.length) return storedChartData.colors.length;
      return storedChartData.areasCount || 0;
    }

    function recolorSelectedChart(index) {
      if (!storedChartData || !document.getElementById('customColorsCheck').checked) return;
      if (index >= selectedChartSeries()) return;
      var hex = colorState[index];
      if (hex) autoColorPreview[index] = hex;
      recolorError = '';
      updateColorsHint();
      parent.postMessage({ pluginMessage: { type: 'recolor', index: index, color: hex } }, '*');
    }

    // "Auto" button: a fresh generated color for this line — different from the
    // one it has now and apart from the other lines, chosen by code.js the same
    // way generation picks colors.
    function generateSeriesColor(index) {
      syncColorsToCount();
      if (index < 0 || index >= colorState.length) return;
      var current = colorState[index] || normalizeHex(autoColorPreview[index]);
      var others = colorState.slice();
      others[index] = null;
      suggestRequestId++;
      pendingSuggestSlots = [index];
      pendingSuggestLive = true;
      parent.postMessage({ pluginMessage: {
        type: 'suggest-colors',
        requestId: suggestRequestId,
        count: colorState.length,
        areaColors: others,
        avoid: current ? [current] : []
      }}, '*');
    }

    // Tells the user where a pick lands: straight onto the selected chart, or
    // into the form until "Insert chart". A failed recolor shows its reason.
    var recolorError = '';
    function updateColorsHint() {
      var hint = document.getElementById('seriesColorsHint');
      if (recolorError) {
        hint.className = 'color-hint error';
        hint.textContent = recolorError;
      } else {
        hint.className = 'color-hint';
        hint.textContent = storedChartData
          ? 'Colors apply to the selected chart right away'
          : 'Colors apply when you insert the chart';
      }
    }

    // Clicks inside the picker are marked here (the list itself is never
    // re-rendered, so it sees the click even after a row was rebuilt); any
    // other click, or Esc, closes an open palette.
    var clickInsidePicker = false;
    document.getElementById('seriesColorsList').addEventListener('click', function () {
      clickInsidePicker = true;
    });
    function closeColorPalette() {
      if (openColorRow === -1) return;
      openColorRow = -1;
      renderSeriesColors();
    }
    document.addEventListener('click', function () {
      if (clickInsidePicker) { clickInsidePicker = false; return; }
      closeColorPalette();
    });
    document.addEventListener('keydown', function (e) {
      if (e && e.key === 'Escape') closeColorPalette();
    });

    // Text next to a row's swatch: where the color comes from, then its hex.
    function colorValueText(hex) {
      if (!hex) return 'Auto';
      if (!paletteHex.length) return hex;
      return (isPaletteColor(hex) ? 'Palette · ' : 'Custom · ') + hex;
    }

    // Grid order: by hue around the color wheel starting from red, lighter
    // before darker within a similar hue; near-grays go last, light → dark.
    // Display only — generation keeps the palette's own order.
    function hexToHsl(hex) {
      var r = parseInt(hex.slice(1, 3), 16) / 255;
      var g = parseInt(hex.slice(3, 5), 16) / 255;
      var b = parseInt(hex.slice(5, 7), 16) / 255;
      var max = Math.max(r, g, b), min = Math.min(r, g, b);
      var l = (max + min) / 2;
      var d = max - min;
      var h = 0, sat = 0;
      if (d > 0) {
        sat = d / (1 - Math.abs(2 * l - 1));
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
        if (h < 0) h += 360;
      }
      return { h: h, s: sat, l: l };
    }

    var GRAY_SATURATION = 0.2;
    function sortPaletteByHue(hexes) {
      return hexes.slice().sort(function (a, b) {
        var ha = hexToHsl(a), hb = hexToHsl(b);
        var grayA = ha.s < GRAY_SATURATION, grayB = hb.s < GRAY_SATURATION;
        if (grayA !== grayB) return grayA ? 1 : -1;
        if (grayA) return hb.l - ha.l;
        // Start the wheel just below red so pinks/reds (≈345°+) open the grid.
        var keyA = (ha.h + 15) % 360, keyB = (hb.h + 15) % 360;
        if (Math.abs(keyA - keyB) > 0.5) return keyA - keyB;
        return hb.l - ha.l;
      });
    }

    function isPaletteColor(hex) {
      return paletteHex.indexOf(hex) !== -1;
    }

    // Gives the listed Auto rows a concrete color: the one the line has on the
    // chart right now when it is known and not taken by another row, otherwise
    // a suggestion from code.js picked exactly like generation would pick it.
    function fillUnpinnedColors(indices) {
      syncColorsToCount();
      var missing = [];
      indices.forEach(function (i) {
        if (i < 0 || i >= colorState.length || colorState[i] !== null) return;
        var current = normalizeHex(autoColorPreview[i]);
        if (current && colorState.indexOf(current) === -1) colorState[i] = current;
        else missing.push(i);
      });
      if (missing.length) {
        suggestRequestId++;
        pendingSuggestSlots = missing;
        pendingSuggestLive = false;
        parent.postMessage({ pluginMessage: {
          type: 'suggest-colors',
          requestId: suggestRequestId,
          count: colorState.length,
          areaColors: colorState.slice()
        }}, '*');
      }
      renderSeriesColors();
    }

    function applySuggestedColors(msg) {
      if (msg.requestId !== suggestRequestId) return; // a newer request superseded it
      var colors = msg.colors || [];
      var live = pendingSuggestLive;
      var filled = [];
      pendingSuggestSlots.forEach(function (i) {
        // A filled-in Auto row only takes the suggestion if still empty; the
        // "Auto" button asked for this exact row, so it always takes it.
        if (i < colorState.length && (live || colorState[i] === null)) {
          colorState[i] = normalizeHex(colors[i]);
          filled.push(i);
        }
      });
      pendingSuggestSlots = [];
      pendingSuggestLive = false;
      renderSeriesColors();
      if (live) filled.forEach(recolorSelectedChart);
    }

    function toggleColorRow(index) {
      openColorRow = (openColorRow === index) ? -1 : index;
      renderSeriesColors();
    }

    function seriesDisplayName(index) {
      var name = 'Area ' + (index + 1);
      if (document.getElementById('showLegendCheck').checked) {
        var labels = document.getElementById('legendInput').value.split(',')
          .map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
        if (labels[index]) name += ' · ' + labels[index];
      }
      return name;
    }

    // What generate() sends: pins only while "Custom area colors" is on.
    function currentSeriesColors() {
      syncColorsToCount();
      if (!document.getElementById('customColorsCheck').checked) {
        return colorState.map(function () { return null; });
      }
      return colorState.slice();
    }

    function updateColorsVisibility() {
      var on = document.getElementById('customColorsCheck').checked;
      document.getElementById('seriesColorsField').style.display = on ? 'block' : 'none';
    }

    function buildPalettePanel(index) {
      var panel = document.createElement('div');
      panel.className = 'palette-panel';

      var auto = document.createElement('button');
      auto.type = 'button';
      auto.className = 'palette-auto';
      auto.textContent = 'Auto — generate a new color';
      auto.addEventListener('click', function () {
        openColorRow = -1;
        renderSeriesColors();
        generateSeriesColor(index);
      });
      panel.appendChild(auto);

      // A pinned color outside the palette (e.g. from an older palette) has no
      // swatch in the grid — show it on its own so the current choice stays visible.
      var current = colorState[index];
      if (current && paletteHex.length && !isPaletteColor(current)) {
        var custom = document.createElement('div');
        custom.className = 'palette-custom';
        var csw = document.createElement('span');
        csw.className = 'color-swatch';
        csw.style.background = current;
        custom.appendChild(csw);
        var ctext = document.createElement('span');
        ctext.textContent = current + ' · not in the palette';
        custom.appendChild(ctext);
        panel.appendChild(custom);
      }

      if (!paletteHex.length) {
        var empty = document.createElement('div');
        empty.className = 'palette-empty';
        empty.textContent = 'Palette is loading…';
        panel.appendChild(empty);
        return panel;
      }

      var grid = document.createElement('div');
      grid.className = 'palette-grid';
      paletteDisplay.forEach(function (hex) {
        var sw = document.createElement('button');
        sw.type = 'button';
        var cls = 'palette-color';
        if (colorState[index] === hex) cls += ' selected';
        else if (colorState.indexOf(hex) !== -1) cls += ' used';
        sw.className = cls;
        sw.style.background = hex;
        sw.title = hex;
        sw.addEventListener('click', function () {
          openColorRow = -1; // a pick closes the palette
          setSeriesColor(index, hex);
        });
        grid.appendChild(sw);
      });
      panel.appendChild(grid);
      return panel;
    }

    function renderSeriesColors() {
      syncColorsToCount();
      var list = document.getElementById('seriesColorsList');
      list.innerHTML = '';
      updateColorsHint();
      if (!document.getElementById('customColorsCheck').checked) return;

      colorState.forEach(function (pinned, i) {
        var shown = pinned || autoColorPreview[i] || null;

        var row = document.createElement('div');
        row.className = 'color-row' + (openColorRow === i ? ' open' : '');
        row.addEventListener('click', function () { toggleColorRow(i); });

        var sw = document.createElement('span');
        sw.className = 'color-swatch' + (shown ? '' : ' auto-empty');
        if (shown) sw.style.background = shown;
        row.appendChild(sw);

        var name = document.createElement('span');
        name.className = 'color-name';
        name.textContent = seriesDisplayName(i);
        row.appendChild(name);

        var value = document.createElement('span');
        value.className = 'color-value';
        value.textContent = colorValueText(pinned);
        if (pinned && paletteHex.length) {
          value.title = isPaletteColor(pinned) ? 'Color from the palette' : 'Not in the palette';
        }
        row.appendChild(value);

        if (pinned) {
          var reset = document.createElement('button');
          reset.type = 'button';
          reset.className = 'color-reset';
          reset.title = 'Unpin: the area gets a new generated color on regenerate';
          reset.textContent = '×';
          reset.addEventListener('click', function (e) {
            if (e && e.stopPropagation) e.stopPropagation();
            setSeriesColor(i, null);
          });
          row.appendChild(reset);
        }

        list.appendChild(row);
        if (openColorRow === i) list.appendChild(buildPalettePanel(i));
      });
    }

    // Restores the picker from a chart's saved params (Get values / paste).
    function populateSeriesColors(d) {
      var n = d.areasCount || 3;
      var saved = d.areaColors || [];
      colorState = [];
      autoColorPreview = [];
      for (var i = 0; i < n; i++) {
        colorState.push(normalizeHex(saved[i]));
        autoColorPreview.push(d.colors && d.colors[i] ? rgbToHex(d.colors[i]) : null);
      }
      openColorRow = -1;
      document.getElementById('customColorsCheck').checked = (d.customColors !== undefined)
        ? !!d.customColors
        : colorState.some(function (c) { return c !== null; });
      updateColorsVisibility();
      renderSeriesColors();
    }

    document.getElementById('customColorsCheck').addEventListener('change', function () {
      updateColorsVisibility();
      var on = document.getElementById('customColorsCheck').checked;
      if (on) {
        // Switching the picker on shows real colors at once instead of "Auto".
        // With a chart selected, the rows become exactly that chart's colors.
        syncColorsToCount();
        if (storedChartData) {
          colorState = colorState.map(function (_, i) { return normalizeHex(autoColorPreview[i]); });
        }
        fillUnpinnedColors(colorState.map(function (_, i) { return i; }));
      } else {
        renderSeriesColors();
      }
      // Remember the picker state on the selected chart, so "Get values from
      // chart" and paste bring it back. Its colors do not change.
      if (storedChartData) {
        recolorError = '';
        parent.postMessage({ pluginMessage: {
          type: 'save-area-colors',
          customColors: on,
          areaColors: on ? colorState.slice() : []
        }}, '*');
      }
      resizeUI();
    });
    document.getElementById('legendInput').addEventListener('input', renderSeriesColors);


    // ═══════════════════════════════════════════════
    //  Y axis input parsing
    // ═══════════════════════════════════════════════
    // A Y axis entry is arbitrary text: a plain number ("14"), a number with
    // a unit ("150ms", "12%"), or a clock time ("15:30", "1:02:30"). The
    // numeric part only positions the label on the axis — the text itself is
    // drawn as typed, so nothing gets truncated.
    function parseAxisNumber(str) {
      var s = String(str === undefined || str === null ? '' : str).trim();
      var rest = s.slice(s.match(/^[^\d+\-]*/)[0].length);

      var time = rest.match(/^(-?)(\d{1,4}):([0-5]?\d)(?::([0-5]?\d))?/);
      if (time) {
        var t = parseFloat(time[2]) + parseFloat(time[3]) / 60 + (time[4] ? parseFloat(time[4]) / 3600 : 0);
        return time[1] === '-' ? -t : t;
      }
      // Digit groups may be split by a space ("2 000 000").
      var num = rest.match(/^[-+]?(?:\d{1,3}(?:[ \u00A0\u202F\u2009]\d{3})+|\d+)(?:[.,]\d+)?/);
      if (!num) return NaN;
      var digits = num[0].replace(/[ \u00A0\u202F\u2009]/g, '').replace(',', '.');
      // Thousands shorthand: "100k", "1.5kk", "2kkk" (Cyrillic "к" too);
      // not when a letter follows — "5kB", "10kbps" are units.
      var mult = rest.slice(num[0].length).match(/^ ?([kK\u043A\u041A]{1,3})(?![A-Za-z\u0400-\u04FF])/);
      return parseFloat(mult ? digits + 'e' + 3 * mult[1].length : digits);
    }

    function formatAxisNumber(v) {
      if (typeof v !== 'number' || isNaN(v)) return String(v);
      if (Math.abs(v - Math.round(v)) < 1e-9) return String(Math.round(v));
      return parseFloat(v.toFixed(4)).toString();
    }

    // Returns { values: [numbers for positioning], labels: [texts to draw] }.
    function parseYAxisInput(raw) {
      var tokens = String(raw || '').split(',').map(function (s) { return s.trim(); })
        .filter(function (s) { return s.length > 0; });
      var values = [];
      var allNumeric = true;
      for (var i = 0; i < tokens.length; i++) {
        var v = parseAxisNumber(tokens[i]);
        if (isNaN(v)) allNumeric = false;
        values.push(v);
      }
      // Nothing numeric to anchor on → space the labels evenly.
      if (!allNumeric) {
        for (var i = 0; i < values.length; i++) values[i] = i;
      }
      var custom = false;
      for (var i = 0; i < tokens.length; i++) {
        if (tokens[i] !== formatAxisNumber(values[i])) { custom = true; break; }
      }
      return { values: values, labels: custom ? tokens : null };
    }

    // Show the labels as they were typed ("15:30"), not their positions.
    function yFieldValue(d) {
      var values = d.yValues || [];
      var labels = (d.yLabels && d.yLabels.length === values.length) ? d.yLabels : values;
      return labels.join(', ');
    }

    function populateFromChartData(d) {
      document.getElementById('yInput').value = yFieldValue(d);
      document.getElementById('yUnitInput').value = d.yUnit || '';
      document.getElementById('xUnitInput').value = d.xUnit || '';
      document.getElementById('xInput').value = (d.xLabels || []).join(', ');
      document.getElementById('areasInput').value = String(d.areasCount || 3);
      setRadio('styleGroup', d.areaStyle || 'smooth');
      setRadio('modeGroup', d.areaMode || 'overlap');
      document.getElementById('fillHeightCheck').checked = !!d.fillHeight;
      document.getElementById('opacityInput').value = String(d.fillOpacity !== undefined ? Math.round(d.fillOpacity * 100) / 100 : 0.3);
      document.getElementById('topEventCheck').checked = !!d.topEvent;
      document.getElementById('bottomEventCheck').checked = !!d.bottomEvent;
      updateStackScaleVisibility();

      var hasLegend = (d.showLegend !== undefined) ? !!d.showLegend : ((d.legendLabels || []).length > 0);
      document.getElementById('showLegendCheck').checked = hasLegend;
      document.getElementById('legendInput').value = (d.legendLabels || []).join(', ');
      setLegendAlign(d.legendAlign || 'left');
      updateLegendFieldsVisibility();
      autoResize(document.getElementById('yInput'));
      autoResize(document.getElementById('xInput'));
      autoResizeLegendInput();
      populateSeriesColors(d);

      replaceMode = true;
      setInsertEnabled(true);
      setRegenEnabled(false);
    }

    function regenerate() {
      hideRegenError();
      if (!storedChartData) {
        showRegenError('Failed to get data: no chart found in selected frame');
        return;
      }
      var d = storedChartData;
      if (!d.yValues || d.yValues.length < 2) {
        showRegenError('Failed to get data: could not read Y axis values from chart');
        return;
      }
      if (!d.xLabels || d.xLabels.length < 1) {
        showRegenError('Failed to get data: could not read X axis labels from chart');
        return;
      }

      populateFromChartData(d);
    }

    function generate() {
      var yRaw = document.getElementById('yInput').value.trim();
      var xRaw = document.getElementById('xInput').value.trim();
      var areasRaw = document.getElementById('areasInput').value.trim();
      var fillHeight = document.getElementById('fillHeightCheck').checked;
      var opacityRaw = document.getElementById('opacityInput').value.trim();

      var yParsed = parseYAxisInput(yRaw);
      var yValues = yParsed.values;
      var yLabels = yParsed.labels;
      var xLabels = xRaw.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; });
      var areasCount = Math.max(1, Math.min(20, parseInt(areasRaw) || 3));
      var fillOpacity = Math.max(0.05, Math.min(1, parseFloat(opacityRaw) || 0.3));

      var yUnit = document.getElementById('yUnitInput').value.trim();
      var xUnit = document.getElementById('xUnitInput').value.trim();
      var topEvent = document.getElementById('topEventCheck').checked;
      var bottomEvent = document.getElementById('bottomEventCheck').checked;

      var showLegend = document.getElementById('showLegendCheck').checked;
      var legendRaw = document.getElementById('legendInput').value.trim();
      var legendLabels = legendRaw
        ? legendRaw.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; })
        : [];

      parent.postMessage({ pluginMessage: {
        type: 'generate',
        yValues: yValues,
        yLabels: yLabels,
        yUnit: yUnit,
        xUnit: xUnit,
        xLabels: xLabels,
        areasCount: areasCount,
        areaStyle: getAreaStyle(),
        areaMode: getAreaMode(),
        fillHeight: fillHeight,
        fillOpacity: fillOpacity,
        showLegend: showLegend,
        legendLabels: legendLabels,
        legendAlign: getLegendAlign(),
        areaColors: currentSeriesColors(),
        customColors: document.getElementById('customColorsCheck').checked,
        topEvent: topEvent,
        bottomEvent: bottomEvent,
        replace: replaceMode
      }}, '*');

      replaceMode = false;
      setInsertEnabled(false);
      if (storedChartData) {
        setRegenEnabled(true);
      }
    }

    window.onmessage = function(event) {
      var msg = event.data.pluginMessage;
      if (msg && msg.type === 'palette') {
        paletteHex = (msg.colors || []).map(normalizeHex).filter(function (h) { return h !== null; });
        paletteDisplay = sortPaletteByHue(paletteHex);
        renderSeriesColors();
        return;
      }
      if (msg && msg.type === 'recolor-failed') {
        recolorError = msg.message || 'Could not apply the color';
        updateColorsHint();
        return;
      }
      if (msg && msg.type === 'suggested-colors') {
        applySuggestedColors(msg);
        return;
      }
      if (!msg || msg.type !== 'selection') return;
      recolorError = '';

      if (msg.reason === 'recolor' && msg.hasChart && msg.chartData) {
        // Our own live recolor: keep the form and its buttons exactly as they are.
        storedChartData = msg.chartData;
        autoColorPreview = (msg.chartData.colors || []).map(rgbToHex);
        renderSeriesColors();
        return;
      }

      var bar = document.getElementById('targetBar');
      var name = document.getElementById('targetName');
      var size = document.getElementById('targetSize');
      var regenBtn = document.getElementById('regenBtn');
      var copyBtn = document.getElementById('copyBtn');

      if (msg.hasFrame) {
        bar.className = 'target-bar active';
        name.textContent = msg.name;
        size.textContent = msg.width + ' x ' + msg.height;
      }

      hideRegenError();

      if (msg.hasChart && msg.chartData) {
        storedChartData = msg.chartData;
        regenBtn.style.display = 'block';
        copyBtn.style.display = 'block';
        if (pendingPasteData) {
          // Paste just completed — auto-populate the form so the user can edit
          // immediately, mirroring "Get values from chart" behavior.
          populateFromChartData(msg.chartData);
          pendingPasteData = null;
        } else {
          // Auto rows preview the colors the selected chart has right now.
          autoColorPreview = (msg.chartData.colors || []).map(rgbToHex);
          renderSeriesColors();
          setRegenEnabled(true);
          setInsertEnabled(false);
        }
      } else {
        storedChartData = null;
        regenBtn.style.display = 'none';
        copyBtn.style.display = 'none';
        replaceMode = false;
        setInsertEnabled(true);
      }

      updateColorsHint();
      updateClipboardUI();
      resizeUI();
    };

    function resizeUI() {
      var h = document.body.scrollHeight;
      parent.postMessage({ pluginMessage: { type: 'resize', height: h } }, '*');
    }

    resizeUI();
    parent.postMessage({ pluginMessage: { type: 'get-palette' } }, '*');
    new MutationObserver(resizeUI).observe(document.body, { childList: true, subtree: true, attributes: true });
  </script>
</body>
</html>
