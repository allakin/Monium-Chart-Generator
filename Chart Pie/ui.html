<!DOCTYPE html>
<html>
<head>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F7F8FA;
      color: #1A1A1A;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    h2 { font-size: 15px; font-weight: 600; }
    .subtitle { font-size: 11px; color: #808080; }
    .subtitle a { color: inherit; text-decoration: underline; }

    .target-bar {
      background: #EEEEF0;
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 16px;
      font-size: 11px;
      color: #808080;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .target-bar.active { background: #E8F0FE; color: #4D7CFE; }
    .target-bar .icon { flex-shrink: 0; width: 14px; height: 14px; }
    .target-bar .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .target-bar .size { margin-left: auto; flex-shrink: 0; opacity: 0.7; }

    .btn-regen {
      display: none;
      width: 100%;
      padding: 9px 0;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      background: #4D7CFE;
      color: #fff;
      margin-top: 10px;
    }
    .btn-regen:hover:not(:disabled) { background: #3A6AE8; }
    .btn-regen:active:not(:disabled) { transform: scale(0.97); }
    .btn-regen:disabled { opacity: 0.45; cursor: default; }

    .btn-copy {
      display: none;
      width: 100%;
      padding: 9px 0;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      background: #EEEEF0;
      color: #1A1A1A;
      margin-top: 6px;
    }
    .btn-copy:hover:not(:disabled) { background: #E0E0E0; }
    .btn-copy:active:not(:disabled) { transform: scale(0.97); }
    .btn-copy:disabled { opacity: 0.45; cursor: default; }

    .clipboard-box {
      display: none;
      background: #FFF6E0;
      border: 1px solid #F5D78A;
      border-radius: 6px;
      padding: 8px 10px;
      margin-top: 10px;
    }
    .clipboard-box .row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #7A5A0F;
    }
    .clipboard-box .summary {
      flex: 1;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .clipboard-box .clear-btn {
      border: none;
      background: transparent;
      color: #7A5A0F;
      cursor: pointer;
      font-size: 16px;
      padding: 0 4px;
      line-height: 1;
    }
    .clipboard-box .clear-btn:hover { color: #1A1A1A; }

    /* Loading state: the box opens with a spinner and only then swaps in the
       summary, so the content change is visible and it is clear what was copied. */
    .clipboard-box .spinner {
      display: none;
      width: 11px;
      height: 11px;
      flex-shrink: 0;
      border: 1.5px solid #EBD6A6;
      border-top-color: #7A5A0F;
      border-radius: 50%;
      animation: clipboard-spin 0.6s linear infinite;
    }
    .clipboard-box.loading .spinner { display: block; }
    .clipboard-box.loading .summary { opacity: 0.7; }
    .clipboard-box.loading .clear-btn { visibility: hidden; }
    @keyframes clipboard-spin { to { transform: rotate(360deg); } }

    .btn-paste {
      width: 100%;
      margin-top: 8px;
      padding: 8px 0;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      background: #1A1A1A;
      color: #fff;
    }
    .btn-paste:hover:not(:disabled) { background: #333; }
    .btn-paste:active:not(:disabled) { transform: scale(0.97); }
    .btn-paste:disabled { opacity: 0.45; cursor: default; }

    .field { margin-top: 16px; }
    .field label { display: block; font-size: 11px; color: #808080; margin-bottom: 4px; }
    .field input[type="text"],
    .field input[type="number"],
    .field textarea {
      width: 100%;
      padding: 7px 10px;
      border: 1.5px solid #E0E0E0;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      color: #1A1A1A;
      outline: none;
      transition: border-color 0.15s;
    }
    .field textarea {
      resize: none;
      overflow: hidden;
      line-height: 1.4;
      display: block;
    }
    .field input:focus,
    .field textarea:focus { border-color: #4D7CFE; }
    .field input::placeholder,
    .field textarea::placeholder { color: #AAAAAA; }

    .radio-group {
      display: flex; gap: 6px;
    }
    .radio-option {
      flex: 1;
      padding: 7px 0;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      color: #808080;
      background: #EEEEF0;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .radio-option input { display: none; }
    .radio-option.active { background: #4D7CFE; color: #fff; }
    .radio-option:hover:not(.active) { background: #E0E0E0; }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      line-height: 1;
      color: #1A1A1A;
      cursor: pointer;
    }
    .checkbox-row input[type="checkbox"] {
      width: 14px;
      height: 14px;
      margin: 0;
      flex-shrink: 0;
      accent-color: #4D7CFE;
      cursor: pointer;
      vertical-align: middle;
    }

    /* Segment color picker: one row per segment, palette grid opens under the row. */
    .color-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .color-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px;
      border: 1.5px solid #E0E0E0;
      border-radius: 6px;
      background: #fff;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .color-row:hover { border-color: #C8C8CC; }
    .color-row.open { border-color: #4D7CFE; }
    .color-swatch {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      border-radius: 4px;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1);
    }
    /* Auto without a known color yet: diagonal stripes instead of a fill. */
    .color-swatch.auto-empty {
      background: repeating-linear-gradient(45deg, #E0E0E0 0 3px, #F7F8FA 3px 6px);
    }
    .color-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #1A1A1A;
    }
    .color-value {
      flex-shrink: 0;
      font-size: 11px;
      color: #808080;
      font-variant-numeric: tabular-nums;
    }
    .color-reset {
      flex-shrink: 0;
      border: none;
      background: transparent;
      color: #808080;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
    }
    .color-reset:hover { color: #1A1A1A; }
    .palette-panel {
      padding: 8px;
      border: 1.5px solid #E0E0E0;
      border-radius: 6px;
      background: #fff;
    }
    .palette-auto {
      width: 100%;
      margin-bottom: 8px;
      padding: 5px 0;
      border: none;
      border-radius: 4px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      color: #808080;
      background: #EEEEF0;
      cursor: pointer;
    }
    .palette-auto:hover { background: #E0E0E0; }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 4px;
    }
    .palette-color {
      position: relative;
      aspect-ratio: 1;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      padding: 0;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1);
      transition: transform 0.1s;
    }
    .palette-color:hover { transform: scale(1.15); }
    .palette-color.selected { box-shadow: 0 0 0 2px #fff, 0 0 0 3.5px #1A1A1A; }
    /* Already pinned on another segment — still selectable, just marked. */
    .palette-color.used::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 4px;
      height: 4px;
      margin: -2px 0 0 -2px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
    }
    .palette-empty { font-size: 11px; color: #808080; }
    .color-hint { margin-top: 6px; font-size: 11px; color: #808080; }
    .color-hint.error { color: #E53935; }
    .palette-custom {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      padding: 4px 6px;
      border-radius: 4px;
      background: #F7F8FA;
      box-shadow: inset 0 0 0 1.5px #1A1A1A;
      font-size: 11px;
      color: #1A1A1A;
    }

    .btn {
      width: 100%;
      margin-top: 16px;
      padding: 10px 0;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn-primary { background: #4D7CFE; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #3A6AE8; }
    .btn:disabled { opacity: 0.45; cursor: default; }

    .footer { text-align: center; font-size: 10px; color: #AAAAAA; margin-top: 4px; }

    .error-msg {
      display: none;
      font-size: 11px;
      color: #E53935;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div>
    <h2>Chart Pie Generator</h2>
    <p class="subtitle">Monium Design System · <a href="https://github.com/allakin/Monium-Chart-Generator/wiki" target="_blank" rel="noopener">Documentation</a></p>
  </div>

  <div class="target-bar" id="targetBar">
    <svg class="icon" viewBox="0 0 14 14" fill="none">
      <rect x="1" y="1" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.5" fill="none"/>
    </svg>
    <span class="name" id="targetName">Select a Frame or AutoLayout</span>
    <span class="size" id="targetSize"></span>
  </div>

  <button class="btn-regen" id="regenBtn" onclick="regenerate()">Get values from chart</button>
  <button class="btn-copy" id="copyBtn" onclick="copyChart()">Copy chart</button>
  <div class="error-msg" id="regenError"></div>

  <div class="clipboard-box" id="clipboardBox">
    <div class="row">
      <span class="spinner"></span>
      <span class="summary" id="clipboardSummary">Chart copied</span>
      <button class="clear-btn" onclick="clearCopy()" title="Clear clipboard">×</button>
    </div>
    <button class="btn-paste" id="pasteBtn" onclick="pasteChart()">Paste exact copy</button>
  </div>

  <div class="field">
    <label>Values (comma-separated, leave empty for random)</label>
    <textarea id="valuesInput" rows="1" placeholder="e.g. 660, 150, 142, 122, 5, 15"></textarea>
  </div>

  <div class="field" id="segmentsRow">
    <label>Segments count (1–20)</label>
    <input type="number" id="segmentsInput" value="5" min="1" max="20">
  </div>

  <div class="field">
    <label>Segment colors</label>
    <div class="checkbox-group">
      <label class="checkbox-row">
        <input type="checkbox" id="customColorsCheck"> Custom segment colors
      </label>
    </div>
  </div>

  <div class="field" id="segmentColorsField" style="display: none;">
    <label>Click a segment to pick its color from the palette</label>
    <div class="color-list" id="segmentColorsList"></div>
    <div class="color-hint" id="segmentColorsHint"></div>
  </div>

  <div class="field">
    <label>Legend</label>
    <div class="checkbox-group">
      <label class="checkbox-row">
        <input type="checkbox" id="showLegendCheck"> Show legend
      </label>
    </div>
  </div>

  <div class="field" id="legendLabelsField" style="display: none;">
    <label>Legend labels (comma-separated; missing entries auto-named "Series N")</label>
    <textarea id="legendInput" rows="1" placeholder="e.g. AutocompleteKeys, GenerateYQL, SearchLogs"></textarea>
  </div>

  <div class="field" id="legendAlignField" style="display: none;">
    <label>Legend align</label>
    <div class="radio-group" id="legendAlignGroup">
      <label class="radio-option active" data-value="left">
        <input type="radio" name="legendAlign" value="left" checked> Left
      </label>
      <label class="radio-option" data-value="center">
        <input type="radio" name="legendAlign" value="center"> Center
      </label>
      <label class="radio-option" data-value="right">
        <input type="radio" name="legendAlign" value="right"> Right
      </label>
    </div>
  </div>

  <div class="field">
    <label>Pie style</label>
    <div class="radio-group" id="styleGroup">
      <label class="radio-option" data-value="pie">
        <input type="radio" name="pieStyle" value="pie"> Pie
      </label>
      <label class="radio-option active" data-value="donut">
        <input type="radio" name="pieStyle" value="donut" checked> Donut
      </label>
    </div>
  </div>

  <div class="field" id="innerRadiusRow">
    <label>Inner radius % (30–80)</label>
    <input type="number" id="innerRadiusInput" value="55" min="30" max="80" step="1">
  </div>

  <div class="field" id="cornerRadiusRow">
    <label>Corner radius (0–50)</label>
    <input type="number" id="cornerRadiusInput" value="0" min="0" max="50" step="1">
  </div>

  <div class="field">
    <label>Segment gap (degrees, 0–10)</label>
    <input type="number" id="gapInput" value="1" min="0" max="10" step="0.5">
  </div>

  <div class="field">
    <label>Display</label>
    <div class="checkbox-group">
      <label class="checkbox-row">
        <input type="checkbox" id="labelsCheck"> Show value labels
      </label>
      <label class="checkbox-row" id="totalRow">
        <input type="checkbox" id="totalCheck"> Show center total
      </label>
    </div>
  </div>

  <div class="field">
    <label>Fill opacity (0.05–1.0)</label>
    <input type="number" id="opacityInput" value="1" min="0.05" max="1" step="0.05">
  </div>

  <button class="btn btn-primary" id="insertBtn" onclick="generate()">Insert chart</button>

  <div class="footer">Monium Design System v2.5.1</div>

  <script>
    var storedChartData = null;
    var replaceMode = false;
    var copiedChart = null;
    var pendingPasteData = null;
    var copyLoaderTimer = null;
    var COPY_LOADER_MS = 450;

    function setInsertEnabled(enabled) {
      document.getElementById('insertBtn').disabled = !enabled;
    }

    function setRegenEnabled(enabled) {
      document.getElementById('regenBtn').disabled = !enabled;
    }

    function showRegenError(text) {
      var el = document.getElementById('regenError');
      el.textContent = text;
      el.style.display = 'block';
    }

    function hideRegenError() {
      document.getElementById('regenError').style.display = 'none';
    }

    function copyChart() {
      hideRegenError();
      if (!storedChartData) return;
      if (!storedChartData.colors) {
        showRegenError('Exact copy unavailable: this chart was generated by an older version. Regenerate it once to enable Copy.');
        return;
      }
      copiedChart = JSON.parse(JSON.stringify(storedChartData));
      // Show the clipboard box in a loading state first: copying is instant, but
      // without the pause the box swaps its contents unnoticed and it is unclear
      // which chart data is now on the clipboard.
      showClipboardLoading();
      resizeUI();
      if (copyLoaderTimer) clearTimeout(copyLoaderTimer);
      copyLoaderTimer = setTimeout(function () {
        copyLoaderTimer = null;
        updateClipboardUI();
        resizeUI();
        var n = copiedChart.segmentsCount || 0;
        parent.postMessage({ pluginMessage: { type: 'notify', message: 'Chart copied — ' + n + ' segment' + (n === 1 ? '' : 's') + ' ready to paste' } }, '*');
      }, COPY_LOADER_MS);
    }

    function showClipboardLoading() {
      var box = document.getElementById('clipboardBox');
      box.classList.add('loading');
      box.style.display = 'block';
      document.getElementById('clipboardSummary').textContent = 'Reading chart data…';
      document.getElementById('copyBtn').disabled = true;
      document.getElementById('pasteBtn').disabled = true;
    }

    function pasteChart() {
      if (!copiedChart) return;
      parent.postMessage({ pluginMessage: {
        type: 'paste',
        chartData: copiedChart
      }}, '*');
      // After the plugin renders the chart it will sendSelection back.
      // The next selection update should auto-populate the form (same UX as
      // clicking "Get values from chart") so the user can immediately edit.
      pendingPasteData = copiedChart;
    }

    function clearCopy() {
      if (copyLoaderTimer) { clearTimeout(copyLoaderTimer); copyLoaderTimer = null; }
      copiedChart = null;
      updateClipboardUI();
      resizeUI();
    }

    function updateClipboardUI() {
      // While the copy loader runs the box must stay in its loading state —
      // a selection update arriving meanwhile would otherwise cut it short.
      if (copyLoaderTimer) return;
      var box = document.getElementById('clipboardBox');
      box.classList.remove('loading');
      document.getElementById('copyBtn').disabled = false;
      document.getElementById('pasteBtn').disabled = false;
      if (copiedChart) {
        var n = copiedChart.segmentsCount || (copiedChart.values ? copiedChart.values.length : 0);
        var style = copiedChart.pieStyle || 'donut';
        var styleLabel = style.charAt(0).toUpperCase() + style.slice(1);
        document.getElementById('clipboardSummary').textContent =
          'Copied: ' + n + ' segment' + (n === 1 ? '' : 's') + ' · ' + styleLabel;
        box.style.display = 'block';
      } else {
        box.style.display = 'none';
      }
    }

    function getPieStyle() {
      var checked = document.querySelector('input[name="pieStyle"]:checked');
      return checked ? checked.value : 'donut';
    }

    function updateDonutVisibility() {
      var isDonut = (getPieStyle() === 'donut');
      document.getElementById('innerRadiusRow').style.display = isDonut ? '' : 'none';
      document.getElementById('cornerRadiusRow').style.display = isDonut ? '' : 'none';
      document.getElementById('totalRow').style.display = isDonut ? '' : 'none';
      if (!isDonut) {
        document.getElementById('totalCheck').checked = false;
      }
    }

    function updateSegmentsVisibility() {
      var val = document.getElementById('valuesInput').value.trim();
      var hasValues = val.length > 0 && val.split(',').filter(function(s) { return !isNaN(parseFloat(s.trim())) && s.trim().length > 0; }).length > 0;
      var segRow = document.getElementById('segmentsRow');
      segRow.style.display = hasValues ? 'none' : '';
    }

    // Reusable radio group binding
    function bindRadioGroup(groupId) {
      document.querySelectorAll('#' + groupId + ' .radio-option').forEach(function (opt) {
        opt.addEventListener('click', function () {
          document.querySelectorAll('#' + groupId + ' .radio-option').forEach(function (o) {
            o.classList.remove('active');
          });
          opt.classList.add('active');
          opt.querySelector('input').checked = true;
        });
      });
    }

    // Radio toggle for style group — also fires the donut-only visibility refresh
    document.querySelectorAll('#styleGroup .radio-option').forEach(function(opt) {
      opt.addEventListener('click', function() {
        document.querySelectorAll('#styleGroup .radio-option').forEach(function(o) { o.classList.remove('active'); });
        opt.classList.add('active');
        opt.querySelector('input').checked = true;
        updateDonutVisibility();
      });
    });
    bindRadioGroup('legendAlignGroup');

    function setRadio(groupId, val) {
      document.querySelectorAll('#' + groupId + ' .radio-option').forEach(function(o) {
        o.classList.remove('active');
        if (o.dataset.value === val) {
          o.classList.add('active');
          o.querySelector('input').checked = true;
        }
      });
    }

    function getLegendAlign() {
      var checked = document.querySelector('input[name="legendAlign"]:checked');
      return checked ? checked.value : 'left';
    }
    function setLegendAlign(val) { setRadio('legendAlignGroup', val); }

    function autoResize(el) {
      if (!el || el.offsetParent === null) return; // hidden — scrollHeight is unreliable
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 'px';
    }
    function autoResizeLegendInput() { autoResize(document.getElementById('legendInput')); }

    ['valuesInput', 'legendInput'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) {
        el.addEventListener('input', function () { autoResize(el); });
        autoResize(el);
      }
    });

    function updateLegendFieldsVisibility() {
      var on = document.getElementById('showLegendCheck').checked;
      document.getElementById('legendLabelsField').style.display = on ? 'block' : 'none';
      document.getElementById('legendAlignField').style.display = on ? 'block' : 'none';
      if (on) autoResizeLegendInput();
    }

    document.getElementById('showLegendCheck').addEventListener('change', function () {
      updateLegendFieldsVisibility();
      // When enabling the legend, pre-fill labels with "Series N" defaults for any
      // missing positions based on the current segments count (derived from values
      // if non-empty, else segmentsInput). Existing labels are preserved.
      syncLegendLabelsToCount();
      renderSegmentColors();
      resizeUI();
    });

    // For Pie: effective series count comes from values.length if any, else segmentsInput.
    function getEffectiveSegmentsCount() {
      var valsRaw = document.getElementById('valuesInput').value.trim();
      var vals = valsRaw
        ? valsRaw.split(',').map(function (s) { return parseFloat(s.trim()); }).filter(function (n) { return !isNaN(n); })
        : [];
      if (vals.length > 0) return Math.min(20, vals.length);
      return Math.max(1, Math.min(20, parseInt(document.getElementById('segmentsInput').value) || 5));
    }

    function syncLegendLabelsToCount() {
      if (!document.getElementById('showLegendCheck').checked) return;
      var newCount = getEffectiveSegmentsCount();
      var legendEl = document.getElementById('legendInput');
      var labels = legendEl.value.split(',').map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
      if (newCount > labels.length) {
        for (var i = labels.length; i < newCount; i++) labels.push('Series ' + (i + 1));
      } else if (newCount < labels.length) {
        labels = labels.slice(0, newCount);
      }
      legendEl.value = labels.join(', ');
      autoResize(legendEl);
    }

    // 'change' (not 'input'): fires after value is committed (blur, Enter, spinner click),
    // so typing "15" digit-by-digit doesn't truncate labels at the intermediate "1" state.
    function onSegmentsCountChange() {
      syncLegendLabelsToCount();
      var before = segmentColorState.length;
      syncSegmentColorsToCount();
      // New segments added while the picker is on get a concrete color right away.
      if (document.getElementById('customColorsCheck').checked && segmentColorState.length > before) {
        var added = [];
        for (var i = before; i < segmentColorState.length; i++) added.push(i);
        fillUnpinnedColors(added);
      }
      renderSegmentColors();
    }
    document.getElementById('segmentsInput').addEventListener('change', onSegmentsCountChange);
    document.getElementById('valuesInput').addEventListener('change', onSegmentsCountChange);

    // ═══════════════════════════════════════════════
    //  Segment color picker
    // ═══════════════════════════════════════════════
    // The palette comes from code.js (the same list the chart is generated
    // from), requested once on load. segmentColorState[i] is the pinned hex of
    // segment i or null for Auto; autoColorPreview[i] is the color the segment
    // currently has on the chart, shown for Auto rows.
    var paletteHex = [];
    var paletteDisplay = []; // paletteHex sorted by hue for the grid
    var segmentColorState = [];
    var autoColorPreview = [];
    var openColorRow = -1;
    var suggestRequestId = 0;
    var pendingSuggestSlots = [];
    var pendingSuggestLive = false;

    function rgbToHex(c) {
      if (!c) return null;
      var hex = '#';
      [c.r, c.g, c.b].forEach(function (v) {
        var n = Math.max(0, Math.min(255, Math.round(v * 255)));
        hex += (n < 16 ? '0' : '') + n.toString(16).toUpperCase();
      });
      return hex;
    }

    function normalizeHex(hex) {
      return (typeof hex === 'string' && /^#[0-9a-f]{6}$/i.test(hex.trim())) ? hex.trim().toUpperCase() : null;
    }

    function syncSegmentColorsToCount() {
      var n = getEffectiveSegmentsCount();
      if (segmentColorState.length > n) segmentColorState = segmentColorState.slice(0, n);
      while (segmentColorState.length < n) segmentColorState.push(null);
      if (openColorRow >= n) openColorRow = -1;
    }

    // A user's pick for one segment. When a chart is selected the color is applied
    // to it at once (slice fill + legend dot), without regenerating the chart.
    function setSegmentColor(index, hex) {
      syncSegmentColorsToCount();
      if (index < 0 || index >= segmentColorState.length) return;
      segmentColorState[index] = normalizeHex(hex);
      renderSegmentColors();
      recolorSelectedChart(index);
    }

    // Segments of the selected chart; rows past it (the form asks for more
    // segments than the chart has) only apply on "Insert chart".
    function selectedChartSegments() {
      if (!storedChartData) return 0;
      return storedChartData.segmentsCount || (storedChartData.values ? storedChartData.values.length : 0);
    }

    function recolorSelectedChart(index) {
      if (!storedChartData || !document.getElementById('customColorsCheck').checked) return;
      if (index >= selectedChartSegments()) return;
      var hex = segmentColorState[index];
      if (hex) autoColorPreview[index] = hex;
      recolorError = '';
      updateSegmentColorsHint();
      parent.postMessage({ pluginMessage: { type: 'recolor', index: index, color: hex } }, '*');
    }

    // "Auto" button: a fresh generated color for this segment — different from the
    // one it has now and apart from the other segments, chosen by code.js the same
    // way generation picks colors.
    function generateSegmentColor(index) {
      syncSegmentColorsToCount();
      if (index < 0 || index >= segmentColorState.length) return;
      var current = segmentColorState[index] || normalizeHex(autoColorPreview[index]);
      var others = segmentColorState.slice();
      others[index] = null;
      suggestRequestId++;
      pendingSuggestSlots = [index];
      pendingSuggestLive = true;
      parent.postMessage({ pluginMessage: {
        type: 'suggest-colors',
        requestId: suggestRequestId,
        count: segmentColorState.length,
        segmentColors: others,
        avoid: current ? [current] : []
      }}, '*');
    }

    // Tells the user where a pick lands: straight onto the selected chart, or
    // into the form until "Insert chart". A failed recolor shows its reason.
    var recolorError = '';
    function updateSegmentColorsHint() {
      var hint = document.getElementById('segmentColorsHint');
      if (recolorError) {
        hint.className = 'color-hint error';
        hint.textContent = recolorError;
      } else {
        hint.className = 'color-hint';
        hint.textContent = storedChartData
          ? 'Colors apply to the selected chart right away'
          : 'Colors apply when you insert the chart';
      }
    }

    // Clicks inside the picker are marked here (the list itself is never
    // re-rendered, so it sees the click even after a row was rebuilt); any
    // other click, or Esc, closes an open palette.
    var clickInsidePicker = false;
    document.getElementById('segmentColorsList').addEventListener('click', function () {
      clickInsidePicker = true;
    });
    function closeColorPalette() {
      if (openColorRow === -1) return;
      openColorRow = -1;
      renderSegmentColors();
    }
    document.addEventListener('click', function () {
      if (clickInsidePicker) { clickInsidePicker = false; return; }
      closeColorPalette();
    });
    document.addEventListener('keydown', function (e) {
      if (e && e.key === 'Escape') closeColorPalette();
    });

    // Text next to a row's swatch: where the color comes from, then its hex.
    function colorValueText(hex) {
      if (!hex) return 'Auto';
      if (!paletteHex.length) return hex;
      return (isPaletteColor(hex) ? 'Palette · ' : 'Custom · ') + hex;
    }

    // Grid order: by hue around the color wheel starting from red, lighter
    // before darker within a similar hue; near-grays go last, light → dark.
    // Display only — generation keeps the palette's own order.
    function hexToHsl(hex) {
      var r = parseInt(hex.slice(1, 3), 16) / 255;
      var g = parseInt(hex.slice(3, 5), 16) / 255;
      var b = parseInt(hex.slice(5, 7), 16) / 255;
      var max = Math.max(r, g, b), min = Math.min(r, g, b);
      var l = (max + min) / 2;
      var d = max - min;
      var h = 0, sat = 0;
      if (d > 0) {
        sat = d / (1 - Math.abs(2 * l - 1));
        if (max === r) h = ((g - b) / d) % 6;
        else if (max === g) h = (b - r) / d + 2;
        else h = (r - g) / d + 4;
        h *= 60;
        if (h < 0) h += 360;
      }
      return { h: h, s: sat, l: l };
    }

    var GRAY_SATURATION = 0.2;
    function sortPaletteByHue(hexes) {
      return hexes.slice().sort(function (a, b) {
        var ha = hexToHsl(a), hb = hexToHsl(b);
        var grayA = ha.s < GRAY_SATURATION, grayB = hb.s < GRAY_SATURATION;
        if (grayA !== grayB) return grayA ? 1 : -1;
        if (grayA) return hb.l - ha.l;
        // Start the wheel just below red so pinks/reds (≈345°+) open the grid.
        var keyA = (ha.h + 15) % 360, keyB = (hb.h + 15) % 360;
        if (Math.abs(keyA - keyB) > 0.5) return keyA - keyB;
        return hb.l - ha.l;
      });
    }

    function isPaletteColor(hex) {
      return paletteHex.indexOf(hex) !== -1;
    }

    // Gives the listed Auto rows a concrete color: the one the segment has on the
    // chart right now when it is known and not taken by another row, otherwise
    // a suggestion from code.js picked exactly like generation would pick it.
    function fillUnpinnedColors(indices) {
      syncSegmentColorsToCount();
      var missing = [];
      indices.forEach(function (i) {
        if (i < 0 || i >= segmentColorState.length || segmentColorState[i] !== null) return;
        var current = normalizeHex(autoColorPreview[i]);
        if (current && segmentColorState.indexOf(current) === -1) segmentColorState[i] = current;
        else missing.push(i);
      });
      if (missing.length) {
        suggestRequestId++;
        pendingSuggestSlots = missing;
        pendingSuggestLive = false;
        parent.postMessage({ pluginMessage: {
          type: 'suggest-colors',
          requestId: suggestRequestId,
          count: segmentColorState.length,
          segmentColors: segmentColorState.slice()
        }}, '*');
      }
      renderSegmentColors();
    }

    function applySuggestedColors(msg) {
      if (msg.requestId !== suggestRequestId) return; // a newer request superseded it
      var colors = msg.colors || [];
      var live = pendingSuggestLive;
      var filled = [];
      pendingSuggestSlots.forEach(function (i) {
        // A filled-in Auto row only takes the suggestion if still empty; the
        // "Auto" button asked for this exact row, so it always takes it.
        if (i < segmentColorState.length && (live || segmentColorState[i] === null)) {
          segmentColorState[i] = normalizeHex(colors[i]);
          filled.push(i);
        }
      });
      pendingSuggestSlots = [];
      pendingSuggestLive = false;
      renderSegmentColors();
      if (live) filled.forEach(recolorSelectedChart);
    }

    function toggleColorRow(index) {
      openColorRow = (openColorRow === index) ? -1 : index;
      renderSegmentColors();
    }

    function segmentDisplayName(index) {
      var name = 'Segment ' + (index + 1);
      if (document.getElementById('showLegendCheck').checked) {
        var labels = document.getElementById('legendInput').value.split(',')
          .map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
        if (labels[index]) name += ' · ' + labels[index];
      }
      return name;
    }

    // What generate() sends: pins only while "Custom segment colors" is on.
    function currentSegmentColors() {
      syncSegmentColorsToCount();
      if (!document.getElementById('customColorsCheck').checked) {
        return segmentColorState.map(function () { return null; });
      }
      return segmentColorState.slice();
    }

    function updateSegmentColorsVisibility() {
      var on = document.getElementById('customColorsCheck').checked;
      document.getElementById('segmentColorsField').style.display = on ? 'block' : 'none';
    }

    function buildPalettePanel(index) {
      var panel = document.createElement('div');
      panel.className = 'palette-panel';

      var auto = document.createElement('button');
      auto.type = 'button';
      auto.className = 'palette-auto';
      auto.textContent = 'Auto — generate a new color';
      auto.addEventListener('click', function () {
        openColorRow = -1;
        renderSegmentColors();
        generateSegmentColor(index);
      });
      panel.appendChild(auto);

      // A pinned color outside the palette (e.g. from an older palette) has no
      // swatch in the grid — show it on its own so the current choice stays visible.
      var current = segmentColorState[index];
      if (current && paletteHex.length && !isPaletteColor(current)) {
        var custom = document.createElement('div');
        custom.className = 'palette-custom';
        var csw = document.createElement('span');
        csw.className = 'color-swatch';
        csw.style.background = current;
        custom.appendChild(csw);
        var ctext = document.createElement('span');
        ctext.textContent = current + ' · not in the palette';
        custom.appendChild(ctext);
        panel.appendChild(custom);
      }

      if (!paletteHex.length) {
        var empty = document.createElement('div');
        empty.className = 'palette-empty';
        empty.textContent = 'Palette is loading…';
        panel.appendChild(empty);
        return panel;
      }

      var grid = document.createElement('div');
      grid.className = 'palette-grid';
      paletteDisplay.forEach(function (hex) {
        var sw = document.createElement('button');
        sw.type = 'button';
        var cls = 'palette-color';
        if (segmentColorState[index] === hex) cls += ' selected';
        else if (segmentColorState.indexOf(hex) !== -1) cls += ' used';
        sw.className = cls;
        sw.style.background = hex;
        sw.title = hex;
        sw.addEventListener('click', function () {
          openColorRow = -1; // a pick closes the palette
          setSegmentColor(index, hex);
        });
        grid.appendChild(sw);
      });
      panel.appendChild(grid);
      return panel;
    }

    function renderSegmentColors() {
      syncSegmentColorsToCount();
      var list = document.getElementById('segmentColorsList');
      list.innerHTML = '';
      updateSegmentColorsHint();
      if (!document.getElementById('customColorsCheck').checked) return;

      segmentColorState.forEach(function (pinned, i) {
        var shown = pinned || autoColorPreview[i] || null;

        var row = document.createElement('div');
        row.className = 'color-row' + (openColorRow === i ? ' open' : '');
        row.addEventListener('click', function () { toggleColorRow(i); });

        var sw = document.createElement('span');
        sw.className = 'color-swatch' + (shown ? '' : ' auto-empty');
        if (shown) sw.style.background = shown;
        row.appendChild(sw);

        var name = document.createElement('span');
        name.className = 'color-name';
        name.textContent = segmentDisplayName(i);
        row.appendChild(name);

        var value = document.createElement('span');
        value.className = 'color-value';
        value.textContent = colorValueText(pinned);
        if (pinned && paletteHex.length) {
          value.title = isPaletteColor(pinned) ? 'Color from the palette' : 'Not in the palette';
        }
        row.appendChild(value);

        if (pinned) {
          var reset = document.createElement('button');
          reset.type = 'button';
          reset.className = 'color-reset';
          reset.title = 'Unpin: the segment gets a new generated color on regenerate';
          reset.textContent = '×';
          reset.addEventListener('click', function (e) {
            if (e && e.stopPropagation) e.stopPropagation();
            setSegmentColor(i, null);
          });
          row.appendChild(reset);
        }

        list.appendChild(row);
        if (openColorRow === i) list.appendChild(buildPalettePanel(i));
      });
    }

    // Restores the picker from a chart's saved params (Get values / paste).
    function populateSegmentColors(d) {
      var n = d.segmentsCount || (d.values ? d.values.length : 0) || 5;
      var saved = d.segmentColors || [];
      segmentColorState = [];
      autoColorPreview = [];
      for (var i = 0; i < n; i++) {
        segmentColorState.push(normalizeHex(saved[i]));
        autoColorPreview.push(d.colors && d.colors[i] ? rgbToHex(d.colors[i]) : null);
      }
      openColorRow = -1;
      document.getElementById('customColorsCheck').checked = (d.customColors !== undefined)
        ? !!d.customColors
        : segmentColorState.some(function (c) { return c !== null; });
      updateSegmentColorsVisibility();
      renderSegmentColors();
    }

    document.getElementById('customColorsCheck').addEventListener('change', function () {
      updateSegmentColorsVisibility();
      var on = document.getElementById('customColorsCheck').checked;
      if (on) {
        // Switching the picker on shows real colors at once instead of "Auto".
        // With a chart selected, the rows become exactly that chart's colors.
        syncSegmentColorsToCount();
        if (storedChartData) {
          segmentColorState = segmentColorState.map(function (_, i) { return normalizeHex(autoColorPreview[i]); });
        }
        fillUnpinnedColors(segmentColorState.map(function (_, i) { return i; }));
      } else {
        renderSegmentColors();
      }
      // Remember the picker state on the selected chart, so "Get values from
      // chart" and paste bring it back. Its colors do not change.
      if (storedChartData) {
        recolorError = '';
        parent.postMessage({ pluginMessage: {
          type: 'save-segment-colors',
          customColors: on,
          segmentColors: on ? segmentColorState.slice() : []
        }}, '*');
      }
      resizeUI();
    });
    document.getElementById('legendInput').addEventListener('input', renderSegmentColors);

    document.getElementById('valuesInput').addEventListener('input', updateSegmentsVisibility);

    updateDonutVisibility();
    updateSegmentsVisibility();

    function populateFromChartData(d) {
      if (d.values && d.values.length > 0) {
        document.getElementById('valuesInput').value = d.values.join(', ');
      } else {
        document.getElementById('valuesInput').value = '';
      }
      document.getElementById('segmentsInput').value = String(d.segmentsCount || 5);
      setRadio('styleGroup', d.pieStyle || 'donut');
      document.getElementById('innerRadiusInput').value = String(d.innerRadiusPct || 55);
      document.getElementById('cornerRadiusInput').value = String(d.cornerRadius || 0);
      document.getElementById('gapInput').value = String(d.segmentGap !== undefined ? d.segmentGap : 1);
      document.getElementById('labelsCheck').checked = !!d.showLabels;
      document.getElementById('totalCheck').checked = !!d.showTotal;
      document.getElementById('opacityInput').value = String(d.fillOpacity !== undefined ? Math.round(d.fillOpacity * 100) / 100 : 1);

      var hasLegend = (d.showLegend !== undefined) ? !!d.showLegend : ((d.legendLabels || []).length > 0);
      document.getElementById('showLegendCheck').checked = hasLegend;
      document.getElementById('legendInput').value = (d.legendLabels || []).join(', ');
      setLegendAlign(d.legendAlign || 'left');
      populateSegmentColors(d);

      updateDonutVisibility();
      updateSegmentsVisibility();
      updateLegendFieldsVisibility();
      autoResize(document.getElementById('valuesInput'));
      autoResizeLegendInput();

      replaceMode = true;
      setInsertEnabled(true);
      setRegenEnabled(false);
    }

    function regenerate() {
      hideRegenError();
      if (!storedChartData) {
        showRegenError('Failed to get data: no chart found in selected frame');
        return;
      }
      populateFromChartData(storedChartData);
    }

    function generate() {
      var valRaw = document.getElementById('valuesInput').value.trim();
      var values = [];
      if (valRaw.length > 0) {
        values = valRaw.split(',').map(function(s) { return parseFloat(s.trim()); }).filter(function(n) { return !isNaN(n) && n > 0; });
      }

      var segmentsCount = Math.max(1, Math.min(20, parseInt(document.getElementById('segmentsInput').value) || 5));
      var pieStyle = getPieStyle();
      var innerRadiusPct = Math.max(30, Math.min(80, parseInt(document.getElementById('innerRadiusInput').value) || 55));
      var cornerRadius = Math.max(0, Math.min(50, parseInt(document.getElementById('cornerRadiusInput').value) || 0));
      var segmentGap = Math.max(0, Math.min(10, parseFloat(document.getElementById('gapInput').value) || 0));
      var showLabels = document.getElementById('labelsCheck').checked;
      var showTotal = document.getElementById('totalCheck').checked;
      var fillOpacity = Math.max(0.05, Math.min(1, parseFloat(document.getElementById('opacityInput').value) || 1));

      var showLegend = document.getElementById('showLegendCheck').checked;
      var legendRaw = document.getElementById('legendInput').value.trim();
      var legendLabels = legendRaw
        ? legendRaw.split(',').map(function(s) { return s.trim(); }).filter(function(s) { return s.length > 0; })
        : [];

      parent.postMessage({ pluginMessage: {
        type: 'generate',
        values: values,
        segmentsCount: segmentsCount,
        pieStyle: pieStyle,
        innerRadiusPct: innerRadiusPct,
        cornerRadius: cornerRadius,
        segmentGap: segmentGap,
        showLabels: showLabels,
        showTotal: showTotal,
        fillOpacity: fillOpacity,
        showLegend: showLegend,
        legendLabels: legendLabels,
        legendAlign: getLegendAlign(),
        segmentColors: currentSegmentColors(),
        customColors: document.getElementById('customColorsCheck').checked,
        replace: replaceMode
      }}, '*');

      replaceMode = false;
      setInsertEnabled(false);
      if (storedChartData) {
        setRegenEnabled(true);
      }
    }

    window.onmessage = function(event) {
      var msg = event.data.pluginMessage;
      if (msg && msg.type === 'palette') {
        paletteHex = (msg.colors || []).map(normalizeHex).filter(function (h) { return h !== null; });
        paletteDisplay = sortPaletteByHue(paletteHex);
        renderSegmentColors();
        return;
      }
      if (msg && msg.type === 'recolor-failed') {
        recolorError = msg.message || 'Could not apply the color';
        updateSegmentColorsHint();
        return;
      }
      if (msg && msg.type === 'suggested-colors') {
        applySuggestedColors(msg);
        return;
      }
      if (!msg || msg.type !== 'selection') return;
      recolorError = '';

      if (msg.reason === 'recolor' && msg.hasChart && msg.chartData) {
        // Our own live recolor: keep the form and its buttons exactly as they are.
        storedChartData = msg.chartData;
        autoColorPreview = (msg.chartData.colors || []).map(rgbToHex);
        renderSegmentColors();
        return;
      }

      var bar = document.getElementById('targetBar');
      var name = document.getElementById('targetName');
      var size = document.getElementById('targetSize');
      var regenBtn = document.getElementById('regenBtn');
      var copyBtn = document.getElementById('copyBtn');

      if (msg.hasFrame) {
        bar.className = 'target-bar active';
        name.textContent = msg.name;
        size.textContent = msg.width + ' x ' + msg.height;
      }

      hideRegenError();

      if (msg.hasChart && msg.chartData) {
        storedChartData = msg.chartData;
        regenBtn.style.display = 'block';
        copyBtn.style.display = 'block';
        if (pendingPasteData) {
          // Paste just completed — auto-populate the form so the user can edit
          // immediately, mirroring "Get values from chart" behavior.
          populateFromChartData(msg.chartData);
          pendingPasteData = null;
        } else {
          // Auto rows preview the colors the selected chart has right now.
          autoColorPreview = (msg.chartData.colors || []).map(rgbToHex);
          renderSegmentColors();
          setRegenEnabled(true);
          setInsertEnabled(false);
        }
      } else {
        storedChartData = null;
        regenBtn.style.display = 'none';
        copyBtn.style.display = 'none';
        replaceMode = false;
        setInsertEnabled(true);
      }

      updateSegmentColorsHint();
      updateClipboardUI();
      resizeUI();
    };

    function resizeUI() {
      var h = document.body.scrollHeight;
      parent.postMessage({ pluginMessage: { type: 'resize', height: h } }, '*');
    }

    resizeUI();
    parent.postMessage({ pluginMessage: { type: 'get-palette' } }, '*');
    new MutationObserver(resizeUI).observe(document.body, { childList: true, subtree: true, attributes: true });
  </script>
</body>
</html>
